name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "server/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, syntax, tests, and dependency audit
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Run ESLint
        run: npm run lint --prefix server

      - name: Check JavaScript syntax
        shell: bash
        run: find server/src server/tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Run backend tests
        run: npm test --prefix server

      - name: Audit dependencies
        run: npm audit --prefix server --audit-level=high
