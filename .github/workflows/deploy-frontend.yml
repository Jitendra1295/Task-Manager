name: Deploy frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - "client/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_BASE_URL: https://jeet.serveblog.net/api
        run: npm run build

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["iss", "aud", "sub", "repository", "ref", "event_name"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::028722616652:role/GitHubActionsTaskManagerDeployRole
          aws-region: ap-south-1

      - name: Deploy hashed assets to S3
        run: >-
          aws s3 sync client/dist/assets/
          s3://task-manager-frontend-jeet/assets/
          --cache-control "public, max-age=31536000, immutable"

      - name: Deploy non-hashed files to S3
        run: >-
          aws s3 sync client/dist/
          s3://task-manager-frontend-jeet
          --delete
          --exclude "assets/*"
          --cache-control "no-cache, no-store, must-revalidate"
